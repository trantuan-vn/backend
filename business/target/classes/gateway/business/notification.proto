syntax = "proto3";

package com.smartconsultor.microservice.business.adapter.dto.gateway.business;

option java_multiple_files = true;
option java_package = "com.smartconsultor.microservice.business.adapter.dto.gateway.business";
option java_outer_classname = "NotificationProto";

message NotificationPromo {
  string title = 1;
  string body = 2;
}

message NotificationSystem {
  string message = 1;
  string level = 2;
}
