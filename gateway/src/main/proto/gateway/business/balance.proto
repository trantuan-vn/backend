syntax = "proto3";

package com.smartconsultor.microservice.gateway.adapter.dto.gateway.business;

option java_multiple_files = true;
option java_package = "com.smartconsultor.microservice.gateway.adapter.dto.gateway.business";
option java_outer_classname = "BalanceProto";

message BalanceUpdated {
  string userId = 1;
  double newBalance = 2;
  string updatedAt = 3;
}

message WalletLocked {
  string userId = 1;
  string reason = 2;
}

message WalletUnlocked {
  string userId = 1;
}
