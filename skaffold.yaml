apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: backend
build:
  artifacts:
    - image: tuantahp/gateway
      context: gateway
      jib:
        project: com.smartconsultor:com-smartconsultor-microservice-gateway
manifests:
  rawYaml:
    - k8s/0_cert.yaml
    - k8s/1_gateway_deployment_v1_debug.yaml
    - k8s/2_ingressgateway.yaml
    - k8s/3_gateway_service.yaml
    - k8s/4_keycloak_service.yaml
    - k8s/5_monitor_service.yaml
    - k8s/6_allow-gateway-access-sys.yaml
portForward:    
  - resourceType: deployment
    resourceName: gateway-deployment-v1
    port: 5006
    localPort: 5006 